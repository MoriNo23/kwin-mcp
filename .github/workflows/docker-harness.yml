name: Docker smoke harness

# Runs scripts/test-distro.sh in CI for every supported distro slot.
# Matrix lets us add new distros (fedora, kubuntu, opensuse, ...) by appending
# an entry below — no further wiring required as long as the corresponding
# docker/<distro>.Dockerfile exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: smoke (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [manjaro]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Install build deps for wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository-2.0-dev libdbus-1-dev pkg-config

      - name: Provision virtual DRM render node (vkms + vgem)
        # KWin's ScreenShot2 D-Bus pipeline needs a DRM render node even in
        # software-rendering mode (see docker/runtime-contract.md). GitHub-
        # hosted runners have no GPU, so we load two in-kernel virtual DRM
        # drivers: vkms (Virtual KMS — provides display/modeset surface) and
        # vgem (Virtual GEM — render-only driver that actually exposes
        # /dev/dri/renderD128). vkms alone only creates control nodes
        # (cardN), not render nodes. Azure runner kernels ship both modules
        # only via linux-modules-extra-<kver>, install that first.
        # `udevadm settle` waits for the kernel to publish the device nodes.
        # The wrapper's dri_args block then mounts the node conditionally;
        # perms are normalised to 0666 to match the Manjaro udev rule the
        # harness was designed against.
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          sudo modprobe vgem
          sudo udevadm settle
          ls -la /dev/dri/
          sudo chmod 0666 /dev/dri/renderD* 2>/dev/null || true
          if [ ! -e /dev/dri/renderD128 ]; then
            echo "::error::No DRM render node was created by vkms+vgem; ScreenShot2 will fail." >&2
            exit 1
          fi

      - name: Run smoke harness
        env:
          # Use the runner's default unix socket; override the wrapper's
          # local-dev fallback (tcp://localhost:2375).
          DOCKER_HOST: unix:///var/run/docker.sock
        run: scripts/test-distro.sh ${{ matrix.distro }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence-${{ matrix.distro }}
          path: .sisyphus/evidence/${{ matrix.distro }}/
          if-no-files-found: warn
